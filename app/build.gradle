plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
// Debug builds and CI do not require a private release key.
def signingProperties = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.isFile()) {
    signingFile.withInputStream { signingProperties.load(it) }
}
def signingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningAvailable = signingKeys.every { signingProperties.getProperty(it)?.trim() } &&
        rootProject.file(signingProperties.getProperty('storeFile', '')).isFile()
if (signingFile.isFile() && !releaseSigningAvailable) {
    throw new GradleException('signing.properties is incomplete or its keystore file is missing. See docs/BUILDING.md.')
}

android {
    namespace 'de.moritz.karteikarten'
    compileSdk 37
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'de.moritz.karteikarten'
        minSdk 26
        targetSdk 37
        versionCode 7
        versionName '1.2.0'
    }
    signingConfigs {
        if (releaseSigningAvailable) {
            local {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningAvailable) signingConfig signingConfigs.local
            minifyEnabled false
        }
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2026.02.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
}
